<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vale I Dev. Sistemas a medida, landings, tiendas online y clases de programación."
    />
    <meta name="theme-color" content="#07070B" />
    <meta property="og:title" content="Vale I Dev — Sistemas a medida y soluciones digitales" />
    <meta
      property="og:description"
      content="Landings, tiendas y sistemas web a medida, con mantenimiento y clases."
    />
    <meta property="og:type" content="website" />
    <title>Vale I Dev — Sistemas a medida y soluciones digitales</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("vale-theme-v2");
          var dark = theme !== "light";
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#07070B" : "#FAFAFC");

          var lang = localStorage.getItem("vale-lang");
          if (lang !== "es" && lang !== "en") {
            lang = (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
          }
          document.documentElement.lang = lang;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
